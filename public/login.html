<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf9f6">
    <meta name="description" content="Sign in to Two of Us Chores.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/login.css">
    <title>Sign in · Two of Us</title>
  </head>
  <body>
    <main class="login-view" aria-labelledby="loginTitle">
      <section class="login-card">
        <p class="wordmark">two of us</p>
        <h1 id="loginTitle">Household chores</h1>
        <p class="lede">Sign in to view and update the shared list.</p>
        <form id="loginForm" novalidate>
          <label>Who is signing in?<select id="loginUser" name="userId" required><option value="D">Dylan</option><option value="M">Mady</option></select></label>
          <div><label for="loginPassword">Password</label><div class="password-field"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></div>
          <p id="loginError" role="alert" hidden></p>
          <button type="submit">Open the list</button>
        </form>
      </section>
    </main>
    <script src="/login.js" type="module"></script>
  </body>
</html>
