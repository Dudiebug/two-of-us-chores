name: Publish Signed Chores 1.2.6

on:
  push:
    branches: [main]
    paths: [releases/publish-signed-1.2.6.json]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download preserved signed release bundle
        run: |
          set -euo pipefail
          RUN=$(jq -r .signed_run releases/publish-signed-1.2.6.json)
          [[ "$RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = failure
          mkdir -p release
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
            --name chores-1.2.6-signed-release --dir release

      - name: Verify preserved signed release bundle
        run: |
          set -euo pipefail
          EXPECTED_APK=$(jq -r .apk_sha256 releases/publish-signed-1.2.6.json)
          EXPECTED_CERT=$(jq -r .certificate_sha256 releases/publish-signed-1.2.6.json)
          test "$(sha256sum release/chores-1.2.6.apk | awk '{print $1}')" = "$EXPECTED_APK"
          grep -q "$EXPECTED_APK" release/SHA256SUMS.txt
          tr '[:upper:]' '[:lower:]' < release/VERIFICATION.txt | grep -q "$EXPECTED_CERT"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release/VERIFICATION.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' release/VERIFICATION.txt
          grep -q "name='net.dudiebug.chores'" release/package.txt
          grep -q "versionCode='10'" release/package.txt
          grep -q "versionName='1.2.6'" release/package.txt
          grep -q "application-label:'Chores'" release/package.txt

      - name: Publish Chores 1.2.6
        run: |
          set -euo pipefail
          TARGET=$(jq -r .target_commit releases/publish-signed-1.2.6.json)
          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor 2b2dfa63d53e7cf8c69e22991edabee2ff1c2c43 "$TARGET"
          if gh release view v1.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing v1.2.6 release.' >&2
            exit 1
          fi
          gh release create v1.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title 'Chores 1.2.6' \
            --notes-file releases/notes-1.2.6.md \
            release/chores-1.2.6.apk \
            release/SHA256SUMS.txt \
            release/VERIFICATION.txt \
            release/package.txt

      - name: Remove one-run publication files
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/publish-signed-chores-1.2.6.yml \
            releases/publish-signed-1.2.6.json
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-run Chores 1.2.6 publication files"
            git push origin HEAD:main
          fi
