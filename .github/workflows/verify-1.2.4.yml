name: Verify Chores 1.2.4
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths:
      - .github/workflows/verify-1.2.4.yml
      - updates/apply-1.2.4-colors.py
      - public/mobile-dialogs.css
      - test/ui-hotfix-1.2.4.test.mjs
      - android/build-1.2.sh
      - android/capacitor/capacitor.config.json
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply user color rendering fix
        run: python3 updates/apply-1.2.4-colors.py
      - name: Install browser and icon test dependencies
        run: |
          python3 -m pip install --quiet cairosvg playwright
          python3 -m playwright install --with-deps chromium
      - name: Run full tests and build Android 1.2.4
        run: bash android/build-1.2.sh
      - name: Run rendered browser smoke test
        run: python3 tools/browser-smoke.py
      - name: Verify APK identity
        run: |
          APK=android/capacitor/dist/chores-1.2.4-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "name='net.dudiebug.chores'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='1.2.4'" /tmp/badging.txt
          grep -q "application-label:'Chores'" /tmp/badging.txt
      - name: Commit verified UI fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js public/user-colors.css
          if ! git diff --cached --quiet; then
            git commit -m 'Fix mobile sheets and render configured user colors'
            git push origin HEAD:hotfix/chores-1.2.4-mobile-dialogs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chores-1.2.4-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 3
