name: Build final Chores 1.2.4
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-final-1.2.4-self-color.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install icon renderer
        run: python3 -m pip install --quiet cairosvg
      - name: Build and test final 1.2.4 source
        run: bash android/build-1.2.sh
      - name: Verify APK identity
        run: |
          APK=android/capacitor/dist/chores-1.2.4-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "name='net.dudiebug.chores'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='1.2.4'" /tmp/badging.txt
          grep -q "application-label:'Chores'" /tmp/badging.txt
          sha256sum "$APK" | tee android/capacitor/dist/UNSIGNED_SHA256.txt
          git rev-parse HEAD > android/capacitor/dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chores-1.2.4-final-self-color-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 3
