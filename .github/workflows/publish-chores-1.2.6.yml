name: Publish Chores 1.2.6
on:
  push:
    branches: [main]
    paths: [releases/publish-1.2.6.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: chores-v126-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified Chores 1.2.6 build
        run: |
          RUN=$(jq -r .build_run releases/publish-1.2.6.json)
          SOURCE=$(jq -r .source_commit releases/publish-1.2.6.json)
          [[ "$RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name chores-1.2.6-unsigned --dir unsigned
      - name: Reconstruct locally signed APK from public binary delta
        run: |
          set -euo pipefail
          WORK=/tmp/chores-v126-signwork
          rm -rf "$WORK"
          mkdir -p "$WORK" release
          cp unsigned/chores-1.2.6-unsigned.apk "$WORK/chores-1.2.6-unsigned.apk"
          cat releases/signed-apk-1.2.6.patch.part* > /tmp/chores-1.2.6.patch
          test "$(sha256sum /tmp/chores-1.2.6.patch | awk '{print $1}')" = "$(jq -r .patch_sha256 releases/publish-1.2.6.json)"
          test "$(sha256sum "$WORK/chores-1.2.6-unsigned.apk" | awk '{print $1}')" = "$(jq -r .unsigned_sha256 releases/publish-1.2.6.json)"
          (
            cd "$WORK"
            git apply --binary /tmp/chores-1.2.6.patch
          )
          test -f "$WORK/chores-1.2.6-signed.apk"
          ACTUAL=$(sha256sum "$WORK/chores-1.2.6-signed.apk" | awk '{print $1}')
          test "$ACTUAL" = "$(jq -r .signed_sha256 releases/publish-1.2.6.json)"
          cp "$WORK/chores-1.2.6-signed.apk" release/chores-1.2.6.apk
          printf '%s  chores-1.2.6.apk\n' "$ACTUAL" > release/SHA256SUMS.txt
      - name: Verify Android signature and package identity
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs release/chores-1.2.6.apk > release/VERIFICATION.txt
          grep -qi '80becf7ffa79093f07cfc4cb13ab42da0be05eb73855e106103150fb13520cc8' release/VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release/VERIFICATION.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' release/VERIFICATION.txt
          "$BT/aapt" dump badging release/chores-1.2.6.apk > release/package.txt
          grep -q "name='net.dudiebug.chores'" release/package.txt
          grep -q "versionCode='10'" release/package.txt
          grep -q "versionName='1.2.6'" release/package.txt
          grep -q "application-label:'Chores'" release/package.txt
      - name: Publish Chores 1.2.6
        run: |
          SOURCE=$(jq -r .source_commit releases/publish-1.2.6.json)
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --exit-code "$SOURCE" HEAD -- src public android/build-1.2.sh android/capacitor/capacitor.config.json android/native android/tests deploy tools test README.md Dockerfile install.sh .env.example package.json pnpm-lock.yaml
          if gh release view v1.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing v1.2.6 release.' >&2
            exit 1
          fi
          gh release create v1.2.6 --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title 'Chores 1.2.6' --notes-file releases/notes-1.2.6.md release/chores-1.2.6.apk release/SHA256SUMS.txt release/VERIFICATION.txt
