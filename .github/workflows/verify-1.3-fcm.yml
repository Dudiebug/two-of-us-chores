name: Verify Chores 1.3 FCM
on:
  push:
    branches: [main, chores-1.3-fcm]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android artwork dependency
        run: python3 -m pip install --quiet cairosvg
      - name: Build and test Chores 1.3
        run: bash android/build-1.3.sh
      - name: Verify Android package and FCM service
        run: |
          APK=android/capacitor/dist/chores-1.3.0-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q "name='net.dudiebug.chores'" /tmp/badging.txt
          grep -q "versionCode='11'" /tmp/badging.txt
          grep -q "versionName='1.3.0'" /tmp/badging.txt
          grep -q "application-label:'Chores'" /tmp/badging.txt
          grep -q 'net.dudiebug.chores.ChoresFirebaseMessagingService' /tmp/manifest.txt
          git rev-parse HEAD > android/capacitor/dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chores-1.3.0-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 3
