name: Sign and Publish Chores 1.2.5

on:
  push:
    branches: [main]
    paths: [releases/publish-1.2.5.json]

permissions:
  contents: write
  actions: read

concurrency:
  group: chores-v125-publication
  cancel-in-progress: false

jobs:
  sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publication request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(jq -r .build_run releases/publish-1.2.5.json)"
          SOURCE="$(jq -r .source_commit releases/publish-1.2.5.json)"
          APK_SHA="$(jq -r .unsigned_apk_sha256 releases/publish-1.2.5.json)"
          AAB_SHA="$(jq -r .unsigned_aab_sha256 releases/publish-1.2.5.json)"
          [[ "$RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APK_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$AAB_SHA" =~ ^[a-f0-9]{64}$ ]]
          git cat-file -e "$SOURCE^{commit}"
          test "$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          if gh release view v1.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing v1.2.5 release.' >&2
            exit 1
          fi
          echo "build_run=$RUN" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "aab_sha=$AAB_SHA" >> "$GITHUB_OUTPUT"

      - name: Create one-run transfer key and publish only its public half
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release125"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/release125/transfer-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/release125/transfer-private.pem" -pubout \
            -out android/release-1-2-5-transfer-public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/release-1-2-5-transfer-public.pem
          git commit -m "Publish one-run Chores 1.2.5 transfer public key"
          git push origin HEAD:main

      - name: Receive encrypted signing bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release125/transfer" "$RUNNER_TEMP/release125/keystore"
          found=0
          for attempt in $(seq 1 120); do
            git fetch -q origin main
            if git show origin/main:android/release-1-2-5-signing-transfer.b64 > "$RUNNER_TEMP/release125/signing-transfer.b64" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1
          base64 -d "$RUNNER_TEMP/release125/signing-transfer.b64" > "$RUNNER_TEMP/release125/signing-transfer.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/release125/signing-transfer.tar.gz" -C "$RUNNER_TEMP/release125/transfer"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/release125/transfer-private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/release125/transfer/transfer-secret.enc" \
            -out "$RUNNER_TEMP/release125/transfer/transfer.secret"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/release125/transfer/signing-bundle.enc" \
            -out "$RUNNER_TEMP/release125/signing-bundle.tar.gz" \
            -pass file:"$RUNNER_TEMP/release125/transfer/transfer.secret"
          tar --no-same-owner -xzf "$RUNNER_TEMP/release125/signing-bundle.tar.gz" \
            -C "$RUNNER_TEMP/release125/keystore"
          test -s "$RUNNER_TEMP/release125/keystore/signing.keystore"
          test -s "$RUNNER_TEMP/release125/keystore/signing-key-info.txt"

      - name: Download verified Chores 1.2.5 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release125/unsigned"
          gh run download '${{ steps.request.outputs.build_run }}' \
            --repo "$GITHUB_REPOSITORY" \
            --name chores-1.2.5-unsigned \
            --dir "$RUNNER_TEMP/release125/unsigned"
          cd "$RUNNER_TEMP/release125/unsigned"
          test "$(tr -d '\r\n' < SOURCE_COMMIT.txt)" = '${{ steps.request.outputs.source_sha }}'
          test "$(sha256sum chores-1.2.5-unsigned.apk | cut -d' ' -f1)" = '${{ steps.request.outputs.apk_sha }}'
          test "$(sha256sum chores-1.2.5-unsigned.aab | cut -d' ' -f1)" = '${{ steps.request.outputs.aab_sha }}'

      - name: Sign and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          KEYINFO="$RUNNER_TEMP/release125/keystore/signing-key-info.txt"
          KS="$RUNNER_TEMP/release125/keystore/signing.keystore"
          STOREPASS="$(sed -n 's/^Key store password: //p' "$KEYINFO" | tr -d '\r')"
          KEYPASS="$(sed -n 's/^Key password: //p' "$KEYINFO" | tr -d '\r')"
          ALIAS="$(sed -n 's/^Key alias: //p' "$KEYINFO" | tr -d '\r')"
          test -n "$STOREPASS" && test -n "$KEYPASS" && test -n "$ALIAS"

          mkdir -p release125
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out release125/chores-1.2.5.apk \
            "$RUNNER_TEMP/release125/unsigned/chores-1.2.5-unsigned.apk"
          jarsigner -keystore "$KS" -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar release125/chores-1.2.5.aab \
            "$RUNNER_TEMP/release125/unsigned/chores-1.2.5-unsigned.aab" "$ALIAS" >/dev/null

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release125/chores-1.2.5.apk > release125/VERIFICATION.txt
          grep -qi 'Verified using v2 scheme.*true' release125/VERIFICATION.txt
          grep -qi 'Verified using v3 scheme.*true' release125/VERIFICATION.txt
          grep -qi '80becf7ffa79093f07cfc4cb13ab42da0be05eb73855e106103150fb13520cc8' release125/VERIFICATION.txt
          jarsigner -verify release125/chores-1.2.5.aab >/dev/null
          "$BUILD_TOOLS/aapt" dump badging release125/chores-1.2.5.apk > release125/package.txt
          grep -q "name='net.dudiebug.chores'" release125/package.txt
          grep -q "versionCode='9'" release125/package.txt
          grep -q "versionName='1.2.5'" release125/package.txt
          grep -q "application-label:'Chores'" release125/package.txt
          printf '\nSource commit: %s\nBuild run: %s\n' \
            '${{ steps.request.outputs.source_sha }}' '${{ steps.request.outputs.build_run }}' \
            >> release125/VERIFICATION.txt
          sha256sum release125/chores-1.2.5.apk release125/chores-1.2.5.aab \
            | sed 's#release125/##' > release125/SHA256SUMS.txt

      - name: Publish Chores 1.2.5
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.2.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ steps.request.outputs.source_sha }}' \
            --title 'Chores 1.2.5' \
            --notes-file releases/notes-1.2.5.md \
            release125/chores-1.2.5.apk \
            release125/chores-1.2.5.aab \
            release125/SHA256SUMS.txt \
            release125/VERIFICATION.txt

      - name: Remove one-run publication material from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/sign-publish-chores-1.2.5.yml \
            releases/publish-1.2.5.json \
            android/release-1-2-5-transfer-public.pem \
            android/release-1-2-5-signing-transfer.b64
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-run Chores 1.2.5 publication material"
            git push origin HEAD:main
          fi
          find "$RUNNER_TEMP/release125" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/release125"
