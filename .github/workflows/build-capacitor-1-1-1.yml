name: Build Capacitor Release 1.1.1

on:
  push:
    branches: [main]
    paths:
      - android/release-1-1-1.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Capacitor 1.1.1
        shell: bash
        run: bash android/build-capacitor-1-1-1.sh

      - name: Upload unsigned Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: chores-capacitor-1.1.1-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 1
