name: Sign and Publish Capacitor Release 1.1

on:
  push:
    branches: [main]
    paths:
      - android/sign-release-1-1.json

permissions:
  contents: write
  actions: read

jobs:
  sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create one-run transfer key and publish only its public half
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release11"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/release11/transfer-private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/release11/transfer-private.pem" -pubout \
            -out android/release-1-1-transfer-public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/release-1-1-transfer-public.pem
          git commit -m "Publish one-run Release 1.1 transfer public key"
          git push origin HEAD:main

      - name: Wait for encrypted Release 1 recovery key transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release11/transfer"
          found=0
          for attempt in $(seq 1 90); do
            git fetch -q origin main
            if git show origin/main:android/release-1-1-recovery-transfer.b64 > "$RUNNER_TEMP/release11/recovery-transfer.b64" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" -eq 1
          base64 -d "$RUNNER_TEMP/release11/recovery-transfer.b64" > "$RUNNER_TEMP/release11/recovery-transfer.tar.gz"
          tar -xzf "$RUNNER_TEMP/release11/recovery-transfer.tar.gz" -C "$RUNNER_TEMP/release11/transfer"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/release11/transfer-private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/release11/transfer/transfer-secret.enc" \
            -out "$RUNNER_TEMP/release11/transfer/transfer.secret"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/release11/transfer/recovery-private-key.enc" \
            -out "$RUNNER_TEMP/release11/recovery-private.pem" \
            -pass file:"$RUNNER_TEMP/release11/transfer/transfer.secret"
          chmod 600 "$RUNNER_TEMP/release11/recovery-private.pem"
          openssl pkey -in "$RUNNER_TEMP/release11/recovery-private.pem" -check -noout >/dev/null

      - name: Recover Release 1 Android signing keystore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release11/recovery" "$RUNNER_TEMP/release11/keystore"
          gh release download v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'release-1-signing-recovery-encrypted.tar.gz' \
            --dir "$RUNNER_TEMP/release11/recovery"
          tar -xzf "$RUNNER_TEMP/release11/recovery/release-1-signing-recovery-encrypted.tar.gz" \
            -C "$RUNNER_TEMP/release11/recovery"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/release11/recovery-private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/release11/recovery/signing-secret.enc" \
            -out "$RUNNER_TEMP/release11/recovery/signing-backup.secret"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/release11/recovery/signing-backup.enc" \
            -out "$RUNNER_TEMP/release11/recovery/release-1-signing-backup.tar.gz" \
            -pass file:"$RUNNER_TEMP/release11/recovery/signing-backup.secret"
          tar -xzf "$RUNNER_TEMP/release11/recovery/release-1-signing-backup.tar.gz" \
            -C "$RUNNER_TEMP/release11/keystore"
          test -s "$RUNNER_TEMP/release11/keystore/signing.keystore"
          test -s "$RUNNER_TEMP/release11/keystore/signing-key-info.txt"

      - name: Download unsigned Capacitor 1.1 build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release11/unsigned"
          gh run download 34857203077 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'two-of-us-chores-capacitor-1.1-unsigned' \
            --dir "$RUNNER_TEMP/release11/unsigned"
          test -s "$RUNNER_TEMP/release11/unsigned/two-of-us-chores-1.1.0-unsigned.apk"
          test -s "$RUNNER_TEMP/release11/unsigned/two-of-us-chores-1.1.0-unsigned.aab"

      - name: Sign and verify APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          KEYINFO="$RUNNER_TEMP/release11/keystore/signing-key-info.txt"
          KS="$RUNNER_TEMP/release11/keystore/signing.keystore"
          STOREPASS="$(sed -n 's/^Key store password: //p' "$KEYINFO" | tr -d '\r')"
          KEYPASS="$(sed -n 's/^Key password: //p' "$KEYINFO" | tr -d '\r')"
          ALIAS="$(sed -n 's/^Key alias: //p' "$KEYINFO" | tr -d '\r')"
          test -n "$STOREPASS" && test -n "$KEYPASS" && test -n "$ALIAS"

          mkdir -p release11
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out release11/two-of-us-chores-1.1.0.apk \
            "$RUNNER_TEMP/release11/unsigned/two-of-us-chores-1.1.0-unsigned.apk"
          jarsigner -keystore "$KS" -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar release11/two-of-us-chores-1.1.0.aab \
            "$RUNNER_TEMP/release11/unsigned/two-of-us-chores-1.1.0-unsigned.aab" "$ALIAS" >/dev/null

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release11/two-of-us-chores-1.1.0.apk | tee release11/apk-verify.txt
          grep -qi 'Verified using v2 scheme.*true' release11/apk-verify.txt
          grep -qi '80becf7ffa79093f07cfc4cb13ab42da0be05eb73855e106103150fb13520cc8' release11/apk-verify.txt
          jarsigner -verify release11/two-of-us-chores-1.1.0.aab >/dev/null
          AAPT="$BUILD_TOOLS/aapt"
          "$AAPT" dump badging release11/two-of-us-chores-1.1.0.apk | head -1 | tee release11/package.txt
          grep -q "name='net.dudiebug.chores'" release11/package.txt
          grep -q "versionCode='2'" release11/package.txt
          grep -q "versionName='1.1.0'" release11/package.txt
          sha256sum release11/two-of-us-chores-1.1.0.apk release11/two-of-us-chores-1.1.0.aab > release11/SHA256SUMS.txt

      - name: Publish Release 1.1
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.transfer.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.1.0 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          cat > release11/release-notes.md <<'EOF'
          # Release 1.1

          **Two of Us Chores 1.1** replaces the Chrome-backed TWA with a Capacitor Android app.

          - Package: `net.dudiebug.chores`
          - Version: `1.1.0` / version code `2`
          - Signed with the same Android certificate as Release 1, so it updates the existing install in place
          - Runs the hosted Chores UI in its own Android WebView instead of Chrome/TWA
          - Native Android notifications are posted by **Two of Us Chores**, not grouped under Chrome
          - Browser clients continue using the existing VAPID/Web Push path

          Background native notification checks use Android periodic work and can be delayed by battery optimization. Opening the app and **Send test** check immediately.

          Update the Chores server/LXC to current `main` before enabling native notifications.
          EOF
          gh release create v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Release 1.1' \
            --notes-file release11/release-notes.md \
            release11/two-of-us-chores-1.1.0.apk \
            release11/two-of-us-chores-1.1.0.aab \
            release11/SHA256SUMS.txt

      - name: Remove one-run transfer material from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch android/release-1-1-transfer-public.pem android/release-1-1-recovery-transfer.b64
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-run Release 1.1 transfer material"
            git push origin HEAD:main
          fi
          rm -rf "$RUNNER_TEMP/release11"
