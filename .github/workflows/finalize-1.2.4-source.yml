name: Finalize Chores 1.2.4 source
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths: [.github/workflows/finalize-1.2.4-source.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply already-verified 1.2.4 product patch
        run: python3 updates/apply-1.2.4-colors.py
      - name: Commit product source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js public/user-colors.css src/server.mjs
          git diff --cached --check
          git commit -m 'Fix mobile sheets and render configured user colors'
          git push origin HEAD:hotfix/chores-1.2.4-mobile-dialogs
