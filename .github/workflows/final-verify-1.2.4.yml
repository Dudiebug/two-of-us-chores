name: Final verify Chores 1.2.4
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths: [.github/workflows/final-verify-1.2.4.yml]
permissions:
  contents: read
concurrency:
  group: chores-v124-release-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install browser and icon dependencies
        run: |
          python3 -m pip install --quiet cairosvg playwright
          python3 -m playwright install --with-deps chromium
      - name: Run complete application tests and Android build
        run: bash android/build-1.2.sh
      - name: Verify rendered desktop and mobile UI
        run: |
          python3 tools/browser-smoke.py
          python3 tools/browser-smoke-1.2.4.py
      - name: Verify final APK identity
        run: |
          APK=android/capacitor/dist/chores-1.2.4-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "name='net.dudiebug.chores'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='1.2.4'" /tmp/badging.txt
          grep -q "application-label:'Chores'" /tmp/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chores-1.2.4-final-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 3
