name: Prepare Chores 1.2.4 publisher
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths: [.github/workflows/prepare-publisher-1.2.4.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive 1.2.4 publisher from the proven 1.2.3 publisher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/publish-chores-1.2.3.yml').read_text()
          result = source.replace('1.2.3', '1.2.4').replace('v123', 'v124')
          result = result.replace("grep -q \"versionCode='7'\"", "grep -q \"versionCode='8'\"")
          start = "          cat > release/notes.md <<'EOF'\n"
          end = "          EOF\n"
          i = result.index(start)
          j = result.index(end, i) + len(end)
          result = result[:i] + "          cp releases/notes-1.2.4.md release/notes.md\n" + result[j:]
          Path('.github/workflows/publish-chores-1.2.4.yml').write_text(result)
          PY
          grep -q 'Publish Chores 1.2.4' .github/workflows/publish-chores-1.2.4.yml
          grep -q "versionCode='8'" .github/workflows/publish-chores-1.2.4.yml
          grep -q 'chores-1.2.4-unsigned' .github/workflows/publish-chores-1.2.4.yml
      - name: Commit publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-chores-1.2.4.yml
          git commit -m 'Add Chores 1.2.4 publication workflow'
          git push origin HEAD:hotfix/chores-1.2.4-mobile-dialogs
