name: Verify Chores 1.2.4 self color
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths: [.github/workflows/verify-self-color-1.2.4.yml]
permissions:
  contents: write
concurrency:
  group: chores-v124-self-color
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply self-service color update
        run: python3 updates/apply-1.2.4-self-color.py
      - name: Install rendered UI dependencies
        run: |
          python3 -m pip install --quiet cairosvg playwright
          python3 -m playwright install --with-deps chromium
      - name: Run full tests and build Chores 1.2.4
        run: bash android/build-1.2.sh
      - name: Verify rendered desktop and phone behavior
        run: |
          python3 tools/browser-smoke.py
          python3 tools/browser-smoke-1.2.4.py
      - name: Verify APK identity
        run: |
          APK=android/capacitor/dist/chores-1.2.4-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "name='net.dudiebug.chores'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='1.2.4'" /tmp/badging.txt
          grep -q "application-label:'Chores'" /tmp/badging.txt
      - name: Commit verified product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.mjs public/index.html public/app.js public/user-colors.css tools/browser-smoke-1.2.4.py test/self-color-settings.test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Let users choose their own color in Settings'
            git push origin HEAD:hotfix/chores-1.2.4-mobile-dialogs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chores-1.2.4-self-color-unsigned
          path: android/capacitor/dist/
          if-no-files-found: error
          retention-days: 3
