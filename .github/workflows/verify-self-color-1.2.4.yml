name: Verify Chores 1.2.4 self color
on:
  push:
    branches: [hotfix/chores-1.2.4-mobile-dialogs]
    paths: [.github/workflows/verify-self-color-1.2.4.yml]
permissions:
  contents: write
concurrency:
  group: chores-v124-self-color
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Apply self-service color update
        run: |
          python3 updates/apply-1.2.4-self-color.py
          python3 updates/fix-1.2.4-self-color-refresh.py
          python3 updates/remove-legacy-color-decorator.py
      - name: Run application tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
      - name: Verify rendered desktop and phone behavior
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/browser-smoke.py
          python3 tools/browser-smoke-1.2.4.py
      - name: Commit verified product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.mjs public/index.html public/app.js public/user-colors.css public/admin.js tools/browser-smoke-1.2.4.py test/self-color-settings.test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Let users choose their own color in Settings'
            git push origin HEAD:hotfix/chores-1.2.4-mobile-dialogs
          fi
